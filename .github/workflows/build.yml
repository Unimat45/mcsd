name: build

on:
  # Merging develop into main is a push to main. Pull requests and pushes to
  # other branches (develop, feature/*) do not build.
  push:
    # Pushing a v* tag (on main) publishes a release.
    tags: ["v*"]
  # Manual run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Linux binaries are linked against glibc 2.17 so they run on old distros too.
  GLIBC_VERSION: "2.17"
  ZIG_VERSION: "0.17.1"

jobs:
  web:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Latest LTS (26 "Lithium"). Pinned to the major so a future LTS
          # can't change the build unnoticed; bump it deliberately.
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: web/build
          if-no-files-found: error
          retention-days: 1

  build:
    name: ${{ matrix.target }}
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, test: true }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, zig: true, test: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, zig: true }
          - { os: macos-latest, target: aarch64-apple-darwin, test: true }
          - { os: macos-latest, target: x86_64-apple-darwin }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # The binary embeds the dashboard at compile time.
      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: web/build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Lint and test (native targets)
        if: matrix.test
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Install zig + cargo-zigbuild
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build (zig, glibc ${{ env.GLIBC_VERSION }})
        if: matrix.zig
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.${GLIBC_VERSION}
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; else version="${GITHUB_SHA::7}"; fi
          name="mcsd-${version}-${TARGET}"
          ext=""; [[ "$TARGET" == *windows* ]] && ext=".exe"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/mcsd$ext" README.md "dist/$name/"
          cd dist
          if [[ "$TARGET" == *windows* ]]; then
            7z a -bso0 "$name.zip" "$name"
            echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "$name.tar.gz" "$name"
            echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: mcsd-${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mcsd-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
